name: lisse
description: >-
  Smooth corners for Flutter — arc, Figma squircle, superellipse and clothoid
  as a ShapeBorder, so clip, border and shadow trace the curve. Pure Dart.
version: 0.1.1
repository: https://github.com/JaceThings/Lisse
issue_tracker: https://github.com/JaceThings/Lisse/issues
homepage: https://corne.rs

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"
