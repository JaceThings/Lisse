<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lisse</title>
    <meta
      name="description"
      content="Squircle corners for the web. Bindings for React, Vue, and Svelte."
    />
    <meta name="theme-color" content="#f7f6f2" />
    <link rel="canonical" href="https://corne.rs/" />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph / social previews. The 1200x630 PNG at /og-image.png
         is the de facto standard size — Facebook, X, LinkedIn, Discord,
         Slack, iMessage all render it at ~600 CSS px wide, so 1200 px
         covers 2x DPI without wasting bytes. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="lisse" />
    <meta
      property="og:description"
      content="Squircle corners for the web. Bindings for React, Vue, and Svelte."
    />
    <meta property="og:url" content="https://corne.rs/" />
    <meta property="og:image" content="https://corne.rs/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="lisse" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="lisse" />
    <meta
      name="twitter:description"
      content="Squircle corners for the web. Bindings for React, Vue, and Svelte."
    />
    <meta name="twitter:image" content="https://corne.rs/og-image.png" />

    <!-- Structured data. SoftwareApplication describes the runnable
         library; SoftwareSourceCode describes the repo. Both are parsed
         by Google, Perplexity, and other AI crawlers as the most
         reliable signal of what this page is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Lisse",
            "alternateName": "@lisse/core",
            "description": "JavaScript library that draws squircle corners — the same continuous curve Figma and iOS use. Bindings for React, Vue, and Svelte, plus a framework-agnostic core. Per-corner control, borders, and shadows included.",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Cross-platform (browser, Node, edge runtimes)",
            "url": "https://corne.rs/",
            "downloadUrl": "https://www.npmjs.com/package/@lisse/core",
            "license": "https://opensource.org/licenses/MIT",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": {
              "@type": "Person",
              "name": "Jace Attard",
              "url": "https://github.com/JaceThings"
            }
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "Lisse",
            "codeRepository": "https://github.com/JaceThings/Lisse",
            "programmingLanguage": "TypeScript",
            "license": "https://opensource.org/licenses/MIT",
            "url": "https://github.com/JaceThings/Lisse",
            "author": {
              "@type": "Person",
              "name": "Jace Attard",
              "url": "https://github.com/JaceThings"
            }
          }
        ]
      }
    </script>
    <script>
      // Set `data-platform="mac"` on <html> for macOS desktop browsers so
      // CSS can opt into Mac-specific affordances (e.g. SVG cursors on
      // the lisse title). `Macintosh` in the UA is the canonical marker
      // for macOS browsers and excludes iOS, which reports `iPhone`/
      // `iPad`/`iPod` instead.
      if (/Macintosh/.test(navigator.userAgent)) {
        document.documentElement.setAttribute("data-platform", "mac");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
