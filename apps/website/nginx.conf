server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets, no-cache the index.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Pre-rendered canonical routes live as flat .html files
  # (e.g. /what.html, /playground.html) generated by
  # scripts/prerender-routes.ts. `$uri.html` finds them so direct hits
  # and social unfurls get route-specific meta tags. Unknown routes
  # fall through to the SPA index, which then redirects /typo -> /
  # via the React Router catch-all.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  # Basic gzip; static.gz is generated by Vite if configured.
  gzip on;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    image/svg+xml;
  gzip_min_length 1024;
}
