server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build output (JS/CSS/fonts/images Vite emits with a content
  # hash in the filename) — safe to cache forever. `^~` short-circuits the
  # regex locations below so a hashed /assets/*.woff2 keeps `immutable`
  # rather than falling into the shorter public-asset policy.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unhashed static files copied verbatim from public/ (fonts, images,
  # media, favicons, robots/sitemap/llms text). Their names are stable
  # across deploys, so cache for a day then force revalidation: a swapped
  # file is picked up within 24h, and an unchanged one costs only a 304.
  location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|webp|svg|ico|webm|mp4|txt|xml|json|webmanifest)$ {
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    try_files $uri =404;
  }

  # Deploy marker: the current build's commit SHA (scripts/write-version.ts).
  # The post-deploy purge workflow polls this until it reports the new SHA,
  # so it must never be cached — an exact-match location overrides the .json
  # rule in the regex block above.
  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # HTML shells (the index + prerendered route files). These reference
  # hashed assets, so a stale shell points at asset hashes the new
  # container no longer has, and the page breaks. The deploy-time purge
  # (scripts/purge-cf-cache.ts) evicts them for an instant cutover — but
  # that purge is best-effort: it's skipped whenever the version it polls
  # for never matches what Railway stamps (e.g. squash merges, where
  # RAILWAY_GIT_COMMIT_SHA is the branch commit, not the merge commit),
  # and a missed purge used to strand the apex for the full edge TTL.
  #
  # So correctness no longer depends on the purge. A short edge TTL means
  # a missed purge self-heals within a minute instead of indefinitely:
  #
  #   max-age=0                   browser always revalidates (cheap 304 from
  #                               the edge) so a user never holds a stale shell
  #   s-maxage=60                 Cloudflare caches at the edge for 60s, so a
  #                               missed purge goes stale for at most a minute
  #   stale-while-revalidate=600  serve stale up to 10m while refreshing in the
  #                               background, so the origin sees no revalidation
  #                               stampede when the 60s window lapses
  #
  # Requires a Cloudflare Cache Rule making HTML eligible for cache — CF
  # bypasses HTML by default regardless of these headers.
  location = /index.html {
    add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=600";
  }

  # Everything else is HTML: a clean route URL resolves to its prerendered
  # shell (/playground -> /playground.html) or falls back to the SPA index.
  # try_files serves the match in THIS context, so the header here is what
  # those .html files actually get.
  location / {
    add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=600";
    try_files $uri $uri.html $uri/ /index.html;
  }

  # Basic gzip; text/html is always included implicitly.
  gzip on;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    image/svg+xml;
  gzip_min_length 1024;
}
