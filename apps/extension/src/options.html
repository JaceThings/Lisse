<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lisse options</title>
  <style>
    body {
      font: 14px/1.5 system-ui, sans-serif;
      color: #2a2a28;
      background: #fbfbf9;
      margin: 0;
      padding: 20px 24px;
      min-width: 320px;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: #6b6b66; }
    label { display: flex; align-items: center; gap: 12px; }
    input[type="range"] { flex: 1; accent-color: #737357; }
    output { font-variant-numeric: tabular-nums; width: 3ch; }
    .hint { margin-top: 12px; font-size: 12px; color: #8a8a83; }
  </style>
</head>
<body>
  <h1>Smoothing</h1>
  <p>How softly corners ease in. 0 is the plain arc, 0.6 matches iOS.</p>
  <label>
    <input id="smoothing" type="range" min="0" max="1" step="0.05" value="0.6">
    <output id="value">0.60</output>
  </label>
  <p class="hint">Applies live to every open tab. If a site's popovers read
  too round for your taste, try 0.4–0.5.</p>
  <script src="options.js"></script>
</body>
</html>
