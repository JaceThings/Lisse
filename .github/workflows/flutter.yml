name: flutter

on:
  push:
    branches: [main]
    paths:
      - "packages/flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "packages/flutter/**"
      - ".github/workflows/flutter.yml"

defaults:
  run:
    working-directory: packages/flutter

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
